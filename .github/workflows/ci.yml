name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # The ordering tests drive a real Chromium against the pretend store.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir /tmp/expo-export

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server and worker images
        run: |
          cp .env.example .env
          docker compose --profile prices build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API tests
        working-directory: web/backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Build the React app
        working-directory: web/frontend
        run: |
          npm ci
          npm run build
      - name: Browser helper end-to-end test
        working-directory: web/userscript
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check
          PYTHON="$(which python)" npm test
      - name: Build the container
        working-directory: web
        run: docker compose build
      - name: Check the Compose / Unraid package builds
        run: |
          web/deploy/package.sh ghcr.io/example/shopping-list-web:test test example/repo dist
          cd dist/shopping-list && docker compose config --quiet
